ID: Demo_MTA_Project
_schema-version: '3.1'
description: Demo MTA Project
version: 0.0.1

parameters:
  dep-space: dev
  xs-uaa-app-name: shoppr_dev
  app_name: shoppr
#  deployed_domain: cfapps.eu10.hana.ondemand.com
  ext_redirecturl:
    - 'https://c09726f8trial-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://c9d39d37trial-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://1e3f00ebtrial-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://5dd06586trial-dev-sample-shop.cfapps.ap21.hana.ondemand.com/login/callback'
    - 'https://d9198ae3trial-trail-01d47r9g-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://453ee863trial-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://4076c031trial-demo-owkh0m1v-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://91030c29trial-demo-rx56jjzq-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://8d7159b9trial-dev-sample-shop.cfapps.us10-001.hana.ondemand.com/login/callback'
    - 'https://3b35b5cetrial-dev-sample-shop.cfapps.ap21.hana.ondemand.com/login/callback'
    - 'https://96761135trial-dev-sample-shop.cfapps.ap21.hana.ondemand.com/login/callback'
    - 'https://9ca1bc1btrial-dev-sample-shop.cfapps.ap21.hana.ondemand.com/login/callback'
    - 'https://eaf60afetrial-dev-sample-shop.cfapps.ap21.hana.ondemand.com/login/callback'
modules:
 - name: sample.Shop
   type: html5
   path: sample.Shop
   parameters:
      disk-quota: 512M
      memory: 512M
   build-parameters:
      builder: grunt
   properties:
      SAP_CALM_SERVICE_NAME: sample.Shop          # app name shown in SAP Cloud ALM
      SAP_CALM_SERVICE_TYPE: SAP_CP_CF            # SAP BTP, Cloud Foundry environment
      # Push warnings/errors (approuter + browser UI) to SAP Cloud ALM without OpenTelemetry (calm-push.js)
      SAP_CALM_PUSH_ENABLED: true
      SAP_CALM_PUSH_SERVICE_ID: "dfee1177-e99b-428e-90d9-a472b7e6e245" # <- LMS ID in Cloud ALM (currently the ro-order-srv service; replace with a sample.Shop service ID later)
      SAP_CALM_PUSH_DESTINATION: CALM_datacollector
      SAP_CALM_PUSH_USE_CASE: exm.im # Integration & Exception Monitoring -> Exceptions
      SAP_CALM_PUSH_DEV: true # first tests: synchronous, returns error details (max 100 calls/24h); set false afterwards
      SAP_CALM_PUSH_INTERVAL: 300 # seconds between pushes (only when there is something to send)
   requires:
    - name: uaa_Demo_MTA_Project
    - name: dest_Demo_MTA_Project

resources:
 - name: uaa_Demo_MTA_Project
   parameters:
      path: ./xs-security.json
      service-plan: application
      config:
         xsappname: ${xs-uaa-app-name}
         oauth2-configuration:
           redirect-uris: ${ext_redirecturl}
      service: xsuaa
   type: org.cloudfoundry.managed-service

 - name: dest_Demo_MTA_Project
   parameters:
      service-plan: lite
      service: destination
   type: org.cloudfoundry.managed-service

